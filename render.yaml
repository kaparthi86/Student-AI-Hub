# Render Blueprint: https://render.com/docs/blueprint-spec
# Public launch defaults: beta banner off. Upgrade plan before a large inbound wave.
services:
  - type: web
    name: student-ai-hub
    runtime: node
    region: oregon
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      # Render injects PORT. Set HF_* secrets in the dashboard; do not commit tokens.
      - key: HF_API_TOKEN
        sync: false
      - key: HF_MODEL
        sync: false
      - key: HF_CHAT_URL
        sync: false
      # Public launch: leave off. Set to "1" only for invite-only cohorts.
      - key: BETA_TESTING
        value: "0"
      - key: BETA_MESSAGE
        sync: false
